name: beehive-im
services:
  postgresql:
    image: postgres:16
    container_name: beehive-im-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: Beehive-IM
      POSTGRES_PASSWORD: Beehive-IM
      POSTGRES_DB: Beehive-IM
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Beehive-IM -d Beehive-IM"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beehive-im-network

  redis:
    image: redis:8-alpine
    container_name: beehive-im-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5  
    networks:
      - beehive-im-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: beehive-im-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=beehive-im-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=beehive-im-etcd=http://etcd:2380
      - --initial-cluster-token=beehive-im-etcd-cluster
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - ../../data/etcd:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beehive-im-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: beehive-im-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../../data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beehive-im-network

networks:
  beehive-im-network:
    driver: bridge
