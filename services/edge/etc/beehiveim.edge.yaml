Name: beehiveim.edge.api
Host: 0.0.0.0
Port: 8888
Env: dev
RegistryPrefix: /beehive-im
EdgeID: edge-dev
PresenceTTLSeconds: 90
Ticket:
  TTLSeconds: 30
WebSocket:
  WriteBufferSize: 64
  ReadLimitBytes: 65536
Gateway:
  Endpoints:
  - 127.0.0.1:9100
  NonBlock: true
  Timeout: 2000
GatewayRecovery:
  MaxAttempts: 3
  WindowMs: 5000
  BackoffMs:
  - 50
  - 100
  - 200
  IsolationMs: 10000
Auth:
  Endpoints:
  - 127.0.0.1:9000
  NonBlock: true
  Timeout: 2000
  RefreshCookie:
    Name: refresh_token
    Path: /v1/auth
    SameSite: Lax
    Secure: false
    MaxAgeSeconds: 2592000
Presence:
  Endpoints:
  - 127.0.0.1:9200
  NonBlock: true
  Timeout: 2000
Message:
  Endpoints:
  - 127.0.0.1:9400
  NonBlock: true
  Timeout: 2000
Conversation:
  Endpoints:
  - 127.0.0.1:9300
  NonBlock: true
  Timeout: 2000
User:
  Endpoints:
  - 127.0.0.1:9001
  NonBlock: true
  Timeout: 2000
JWT:
  Secret: beehive-im-dev-secret-change-me
  Issuer: beehive-im
  AccessTTLSeconds: 900
  PreferEnvWhenEmpty: true
  AllowDevDefault: true
DevAuth:
  Enabled: true
Security:
  AllowedOrigins:
  - http://localhost:5173
  - http://127.0.0.1:5173
  - http://localhost:3000
  - http://127.0.0.1:3000
Registry:
  Endpoints:
  - 127.0.0.1:2379
  Prefix: /beehive-im
  Env: dev
RabbitMQ:
  URL: ""
  Exchange: beehive.im.push
  Prefetch: 64
