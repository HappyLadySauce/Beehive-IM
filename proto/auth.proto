syntax = "proto3";

package beehive_im.auth;

option go_package = "./pb";

service AuthService {
    // --- Local account / 本地账号登录 ---
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);

    // Refresh access token using refresh_token
    // 使用 refresh_token 刷新 access_token
    rpc RefreshToken(RefreshTokenRequest) returns (LoginResponse);

    // --- Github OAuth2 authorization code flow / Github 授权登录 ---
    // Step1: client redirect to Github authorize_url
    // 第一步: 客户端重定向到 Github 授权页面
    rpc RedirectToGithubAuthorizeUrl(RedirectToGithubAuthorizeUrlRequest) returns (RedirectToGithubAuthorizeUrlResponse);

    // Step2: client sends code from callback; server exchanges token and issues app session
    // 第二步: 客户端提交回调 code，服务端换 token 并签发应用会话
    rpc GithubCallback(GithubCallbackRequest) returns (LoginResponse);

    // Step 1 for logged-in user binding GitHub
    // 已登录用户绑定 GitHub：第一步获取授权 URL
    rpc LinkGitHub(LinkGitHubRequest) returns (RedirectToGithubAuthorizeUrlResponse);

    // Unbind GitHub from current user
    // 解绑当前用户的 GitHub 账号
    rpc UnlinkGitHub(UnlinkGitHubRequest) returns (UnlinkGitHubResponse);
}

// ==================== Local account ====================

message RegisterRequest {
    string username = 1;
    string email = 2;
    string phone = 3;
    string password = 4;
}

message RegisterResponse {
    string access_token = 1;
    string refresh_token = 2;
    int64 expires_in = 3;       // seconds / 秒
    string token_type = 4;      // e.g. "Bearer"
    UserInfo user = 5;
}

message LoginRequest {
    // account can be username, email, or phone
    // account 可以是用户名、邮箱或手机号
    string account = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    int64 expires_in = 3;       // seconds / 秒
    string token_type = 4;      // e.g. "Bearer"
    UserInfo user = 5;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message LogoutRequest {
    // pass access_token or refresh_token depending on your session model
    // 按会话模型传入 access_token 或 refresh_token
    string access_token = 1;
    string refresh_token = 2;
}

message LogoutResponse {}

message UserInfo {
    string id = 1;
    string username = 2;
    string email = 3;
    string avatar = 4;
}

// ==================== GitHub OAuth2 ====================

message RedirectToGithubAuthorizeUrlRequest {
    // must match a callback URL registered in the GitHub OAuth App
    // 必须与 GitHub OAuth App 中注册的回调地址一致
    string redirect_uri = 1;

    // optional; defaults to server config e.g. "read:user user:email"
    // 可选；默认使用服务端配置，如 "read:user user:email"
    string scope = 2;
}

message RedirectToGithubAuthorizeUrlResponse {
    string authorize_url = 1;
    // client must send this back in GithubCallback for CSRF validation
    // 客户端须在 GithubCallback 中回传，用于 CSRF 校验
    string state = 2;
    int64 expires_in = 3;       // state TTL in seconds / state 有效期（秒）
}

message GithubCallbackRequest {
    string code = 1;            // authorization code from GitHub callback
    string state = 2;           // must match the state from step 1
    string redirect_uri = 3;    // must match the one used in step 1
}

message LinkGitHubRequest {
    string access_token = 1;
    string redirect_uri = 2;
    string scope = 3;
}

message UnlinkGitHubRequest {
    string access_token = 1;
}

message UnlinkGitHubResponse {}
