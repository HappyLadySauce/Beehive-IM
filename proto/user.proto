syntax = "proto3";

package beehive_im.user;

option go_package = "./pb";

service UserService {
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
}


message GetUserRequest {
    string id = 1;
}

message GetUserResponse {
    string id = 1;
    string name = 2;
    string email = 3;
    string phone = 4;
    string created_at = 5;
    string updated_at = 6;
}