syntax = "proto3";

package beehive_im.conversation;

option go_package = "./pb";

service ConversationService {
    // CreateConversation creates a conversation and initial members.
    // CreateConversation 创建会话和初始成员。
    rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);

    // GetConversation returns one conversation with members and user settings.
    // GetConversation 返回单个会话、成员和用户设置。
    rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

    // ListConversations returns conversations joined by one user.
    // ListConversations 返回某个用户加入的会话列表。
    rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

    // AddMembers adds or reactivates members in a conversation.
    // AddMembers 在会话中新增或重新激活成员。
    rpc AddMembers(AddMembersRequest) returns (AddMembersResponse);

    // RemoveMembers marks members as removed from a conversation.
    // RemoveMembers 将成员标记为已移出会话。
    rpc RemoveMembers(RemoveMembersRequest) returns (RemoveMembersResponse);

    // LeaveConversation lets one member leave a group conversation.
    // LeaveConversation 允许成员退出群聊。
    rpc LeaveConversation(LeaveConversationRequest) returns (LeaveConversationResponse);

    // DismissConversation closes a group conversation by owner.
    // DismissConversation 由群主解散群聊。
    rpc DismissConversation(DismissConversationRequest) returns (DismissConversationResponse);

    // TransferOwner transfers group ownership to another active member.
    // TransferOwner 将群主转让给另一位活跃成员。
    rpc TransferOwner(TransferOwnerRequest) returns (TransferOwnerResponse);

    // UpdateMemberRole changes one member role.
    // UpdateMemberRole 修改单个成员角色。
    rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);

    // UpdateConversationSettings updates settings owned by one user.
    // UpdateConversationSettings 更新某个用户自己的会话设置。
    rpc UpdateConversationSettings(UpdateConversationSettingsRequest) returns (UpdateConversationSettingsResponse);

    // MarkConversationRead advances one member read or delivered cursor.
    // MarkConversationRead 推进成员已读或已送达游标。
    rpc MarkConversationRead(MarkConversationReadRequest) returns (MarkConversationReadResponse);

    // CheckSendPermission checks whether a user can send to a conversation.
    // CheckSendPermission 校验用户是否可向会话发送消息。
    rpc CheckSendPermission(CheckSendPermissionRequest) returns (CheckSendPermissionResponse);

    // CheckReadPermission checks whether a user can read a conversation.
    // CheckReadPermission 校验用户是否可读取会话消息。
    rpc CheckReadPermission(CheckReadPermissionRequest) returns (CheckReadPermissionResponse);

    // ResolveMessageRecipients returns active users that should receive a message event.
    // ResolveMessageRecipients 返回应接收消息事件的活跃用户。
    rpc ResolveMessageRecipients(ResolveMessageRecipientsRequest) returns (ResolveMessageRecipientsResponse);

    // AllocateMessageSeq atomically allocates the next conversation message sequence.
    // AllocateMessageSeq 原子分配下一个会话消息序列号。
    rpc AllocateMessageSeq(AllocateMessageSeqRequest) returns (AllocateMessageSeqResponse);
}

message Conversation {
    string conversation_id = 1;
    string type = 2;
    string status = 3;
    string title = 4;
    string owner_user_id = 5;
    int64 current_seq = 6;
    string created_at = 7;
    string updated_at = 8;
}

message ConversationMember {
    string conversation_id = 1;
    string user_id = 2;
    string role = 3;
    string status = 4;
    string muted_until = 5;
    string joined_at = 6;
    string updated_at = 7;
    int64 visible_from_seq = 8;
    int64 visible_to_seq = 9;
    int64 last_read_seq = 10;
    int64 last_delivered_seq = 11;
    string last_read_at = 12;
}

message ConversationSettings {
    string conversation_id = 1;
    string user_id = 2;
    bool pinned = 3;
    string muted_until = 4;
    string remark = 5;
    string updated_at = 6;
}

message MemberInput {
    string user_id = 1;
    string role = 2;
}

message CreateConversationRequest {
    string creator_user_id = 1;
    string type = 2;
    string title = 3;
    repeated MemberInput members = 4;
}

message CreateConversationResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    Conversation conversation = 4;
    repeated ConversationMember members = 5;
}

message GetConversationRequest {
    string conversation_id = 1;
    string requester_user_id = 2;
}

message GetConversationResponse {
    bool found = 1;
    string error_code = 2;
    string message = 3;
    Conversation conversation = 4;
    repeated ConversationMember members = 5;
    ConversationSettings settings = 6;
}

message ListConversationsRequest {
    string user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ListConversationsResponse {
    repeated Conversation conversations = 1;
    repeated ConversationListItem items = 2;
}

message ConversationListItem {
    Conversation conversation = 1;
    ConversationMember member = 2;
    ConversationSettings settings = 3;
    int32 member_count = 4;
}

message AddMembersRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
    repeated MemberInput members = 3;
}

message AddMembersResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    repeated ConversationMember members = 4;
}

message RemoveMembersRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
    repeated string user_ids = 3;
}

message RemoveMembersResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    int32 removed = 4;
}

message LeaveConversationRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
}

message LeaveConversationResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
}

message DismissConversationRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
}

message DismissConversationResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
}

message TransferOwnerRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
    string target_user_id = 3;
}

message TransferOwnerResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    ConversationMember old_owner = 4;
    ConversationMember new_owner = 5;
}

message UpdateMemberRoleRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
    string target_user_id = 3;
    string role = 4;
}

message UpdateMemberRoleResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    ConversationMember member = 4;
}

message UpdateConversationSettingsRequest {
    string conversation_id = 1;
    string actor_user_id = 2;
    string target_user_id = 3;
    bool pinned = 4;
    string muted_until = 5;
    string remark = 6;
}

message UpdateConversationSettingsResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    ConversationSettings settings = 4;
}

message CheckSendPermissionRequest {
    string conversation_id = 1;
    string user_id = 2;
}

message CheckSendPermissionResponse {
    bool allowed = 1;
    string error_code = 2;
    string message = 3;
}

message CheckReadPermissionRequest {
    string conversation_id = 1;
    string user_id = 2;
}

message CheckReadPermissionResponse {
    bool allowed = 1;
    string error_code = 2;
    string message = 3;
    int64 visible_from_seq = 4;
    int64 visible_to_seq = 5;
}

message ResolveMessageRecipientsRequest {
    string conversation_id = 1;
    string sender_id = 2;
}

message ResolveMessageRecipientsResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    repeated string user_ids = 4;
}

message AllocateMessageSeqRequest {
    string conversation_id = 1;
    string user_id = 2;
}

message AllocateMessageSeqResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    int64 seq = 4;
}

message MarkConversationReadRequest {
    string conversation_id = 1;
    string user_id = 2;
    string cursor_type = 3;
    int64 seq = 4;
}

message MarkConversationReadResponse {
    bool accepted = 1;
    string error_code = 2;
    string message = 3;
    int64 last_read_seq = 4;
    int64 last_delivered_seq = 5;
}
